name: AttaBoy
options:
  bundleIdPrefix: com.coagulantchip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Atta-Boy"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to Fallout: London on your local network to display live Pip-Boy game data."
    SUPPORTS_MACCATALYST: NO
targets:
  AttaBoy:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coagulantchip.attaboy
        PRODUCT_NAME: AttaBoy
        MARKETING_VERSION: "1.01"
        CURRENT_PROJECT_VERSION: "101"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - AttaBoyTests
  AttaBoyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AttaBoy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coagulantchip.attaboy.tests
        PRODUCT_NAME: AttaBoyTests
        CODE_SIGNING_ALLOWED: NO
