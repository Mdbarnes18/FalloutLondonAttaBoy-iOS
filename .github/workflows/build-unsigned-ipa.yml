name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for SideStore
    runs-on: macos-15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project AttaBoy.xcodeproj \
            -scheme AttaBoy \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/AttaBoyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/AttaBoyDerivedData/Build/Products/Release-iphoneos/AttaBoy.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/AttaBoy.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/AttaBoy-unsigned.ipa"
          test -s "$GITHUB_WORKSPACE/AttaBoy-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/AttaBoy-unsigned.ipa" | grep -q 'Payload/AttaBoy.app/Info.plist'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AttaBoy-unsigned-IPA
          path: AttaBoy-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
