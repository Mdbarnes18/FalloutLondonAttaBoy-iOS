name: Build Fallout London Companion IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for SideStore
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify shared protocol fixtures
        run: python3 Shared/tools/generate_and_verify_fixtures.py
      - name: Run iOS unit tests (simulator)
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items()) if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project AttaBoy.xcodeproj -scheme AttaBoy -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/AttaBoyTestDerivedData" CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project AttaBoy.xcodeproj \
            -scheme AttaBoy \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/AttaBoyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/AttaBoyDerivedData/Build/Products/Release-iphoneos/AttaBoy.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/AttaBoy.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/AttaBoy-unsigned.ipa"
          test -s "$GITHUB_WORKSPACE/AttaBoy-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/AttaBoy-unsigned.ipa" | grep -q 'Payload/AttaBoy.app/Info.plist'
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fallout-London-Companion-ipa
          path: AttaBoy-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
