name: Release Fallout London Companion

on:
  workflow_run:
    workflows:
      - Build Fallout London Companion IPA
      - Build Fallout London Companion Android
      - Build Fallout London Companion Windows
      - Build Fallout London Companion Linux
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: combined-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check all platform builds
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ios_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion IPA" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          android_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Android" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          windows_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Windows" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          linux_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Linux" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          for value in "$ios_run" "$android_run" "$windows_run" "$linux_run"; do
            if [[ -z "$value" ]]; then
              echo "release_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ios_run=$ios_run" >> "$GITHUB_OUTPUT"
          echo "android_run=$android_run" >> "$GITHUB_OUTPUT"
          echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
          echo "linux_run=$linux_run" >> "$GITHUB_OUTPUT"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"
      - name: Read release version
        if: steps.builds.outputs.release_ready == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(gh api "repos/$REPO/contents/VERSION?ref=$SHA" --jq '.content' | base64 -d | tr -d '\r\n')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download platform artifacts
        if: steps.builds.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IOS_RUN: ${{ steps.builds.outputs.ios_run }}
          ANDROID_RUN: ${{ steps.builds.outputs.android_run }}
          WINDOWS_RUN: ${{ steps.builds.outputs.windows_run }}
          LINUX_RUN: ${{ steps.builds.outputs.linux_run }}
        run: |
          mkdir -p release/ios release/android release/windows release/linux
          gh run download "$IOS_RUN" --repo "$REPO" --name Fallout-London-Companion-ipa --dir release/ios
          gh run download "$ANDROID_RUN" --repo "$REPO" --name Fallout-London-Companion-android-apk --dir release/android
          gh run download "$WINDOWS_RUN" --repo "$REPO" --name Fallout-London-Companion-windows --dir release/windows
          gh run download "$LINUX_RUN" --repo "$REPO" --name Fallout-London-Companion-linux --dir release/linux
      - name: Create combined numbered release
        if: steps.builds.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then exit 0; fi
          test -n "$(find release/ios -type f -name '*.ipa' -print -quit)"
          test -n "$(find release/android -type f -name '*.apk' -print -quit)"
          test -n "$(find release/windows -type f -name '*.msi' -print -quit)"
          test -n "$(find release/windows -type f -name '*.exe' -print -quit)"
          test -n "$(find release/linux -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release/linux -type f -name '*.flatpak' -print -quit)"
          test -n "$(find release/linux -type f -name '*.deb' -print -quit)"
          test -n "$(find release/linux -type f -name '*.rpm' -print -quit)"
          gh release create "$VERSION" release/ios/* release/android/* release/windows/* release/linux/* --repo "$REPO" --title "Fallout London Companion $VERSION" --generate-notes --target "$SHA"
