name: Release Fallout London Companion

on:
  push:
    branches: [dev]
  workflow_run:
    workflows:
      - Build Fallout London Companion IPA
      - Build Fallout London Companion Android
      - Build Fallout London Companion Windows
      - Build Fallout London Companion Linux
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: write

concurrency:
  group: combined-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for all four platform builds on dev
        if: github.event_name == 'push'
        timeout-minutes: 110
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workflows=(
            "Build Fallout London Companion IPA"
            "Build Fallout London Companion Android"
            "Build Fallout London Companion Windows"
            "Build Fallout London Companion Linux"
          )
          for attempt in $(seq 1 180); do
            pending=0
            for workflow in "${workflows[@]}"; do
              result="$(gh run list --repo "$REPO" --workflow "$workflow" --commit "$SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] // {}')"
              status="$(jq -r '.status // empty' <<< "$result")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$result")"
              run_id="$(jq -r '.databaseId // empty' <<< "$result")"
              if [[ -z "$run_id" || "$status" != "completed" ]]; then
                pending=1
                echo "Waiting for $workflow (status: ${status:-not queued})."
              elif [[ "$conclusion" != "success" ]]; then
                echo "$workflow completed with conclusion: $conclusion. No release will be published." >&2
                exit 1
              else
                echo "$workflow passed (run $run_id)."
              fi
            done
            if [[ "$pending" -eq 0 ]]; then
              echo "All four platform builds passed for $SHA."
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for all platform builds for $SHA; no release will be published." >&2
          exit 1

      - name: Check all platform builds
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/contents/.release-reset-pending?ref=dev" >/dev/null 2>&1; then
            echo "Release history reset is pending; skipping this build."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ios_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion IPA" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          android_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Android" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          windows_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Windows" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          linux_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Linux" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          for value in "$ios_run" "$android_run" "$windows_run" "$linux_run"; do
            if [[ -z "$value" || "$value" == "null" ]]; then
              echo "release_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          version="$(gh api "repos/$REPO/contents/VERSION?ref=$SHA" --jq '.content' | base64 -d | tr -d '\r\n')"
          if gh release view "$version" --repo "$REPO" >/dev/null 2>&1; then
            echo "Version $version is already published; this commit does not need another release."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ios_run=$ios_run" >> "$GITHUB_OUTPUT"
          echo "android_run=$android_run" >> "$GITHUB_OUTPUT"
          echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
          echo "linux_run=$linux_run" >> "$GITHUB_OUTPUT"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Read and validate release version
        if: steps.builds.outputs.release_ready == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          version="$(gh api "repos/$REPO/contents/VERSION?ref=$SHA" --jq '.content' | base64 -d | tr -d '\r\n')"
          [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]
          latest="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$latest" ]]; then
            python3 - "$latest" "$version" <<'PY'
          import re, sys
          latest, candidate = sys.argv[1:]
          pattern = re.compile(r"^(\d+)\.(\d{2})$")
          previous = pattern.fullmatch(latest)
          current = pattern.fullmatch(candidate)
          if not previous or not current:
              raise SystemExit(f"Release tags must use MAJOR.MINOR with a two-digit minor: latest={latest!r}, candidate={candidate!r}")
          major, minor = map(int, previous.groups())
          expected = f"{major}.{minor + 1:02d}"
          if candidate != expected:
              raise SystemExit(f"Release version must immediately follow {latest}; expected {expected}, got {candidate}.")
          print(f"Sequential release version validated: {latest} -> {candidate}")
          PY
          else
            echo "No previous published release; accepting initial version $version."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        if: steps.builds.outputs.release_ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download platform artifacts
        if: steps.builds.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IOS_RUN: ${{ steps.builds.outputs.ios_run }}
          ANDROID_RUN: ${{ steps.builds.outputs.android_run }}
          WINDOWS_RUN: ${{ steps.builds.outputs.windows_run }}
          LINUX_RUN: ${{ steps.builds.outputs.linux_run }}
        run: |
          set -euo pipefail
          mkdir -p release/ios release/android release/windows release/linux
          gh run download "$IOS_RUN" --repo "$REPO" --name Fallout-London-Companion-ipa --dir release/ios
          gh run download "$ANDROID_RUN" --repo "$REPO" --name Fallout-London-Companion-android-apk --dir release/android
          gh run download "$WINDOWS_RUN" --repo "$REPO" --name Fallout-London-Companion-windows --dir release/windows
          gh run download "$LINUX_RUN" --repo "$REPO" --name Fallout-London-Companion-linux --dir release/linux

      - name: Normalize release filenames and verify package set
        if: steps.builds.outputs.release_ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pick() {
            local dir="$1" pattern="$2" destination="$3"
            local matches=()
            mapfile -t matches < <(find "$dir" -maxdepth 2 -type f -iname "$pattern" | sort)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one $pattern in $dir; found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "release/$destination"
            test -s "release/$destination"
          }
          pick release/ios '*.ipa' "Fallout-London-Companion-$VERSION-iOS-unsigned.ipa"
          pick release/android '*.apk' "Fallout-London-Companion-$VERSION-Android.apk"
          pick release/windows '*.msi' "Fallout-London-Companion-$VERSION-Windows-Installer.msi"
          pick release/windows '*.exe' "Fallout-London-Companion-$VERSION-Windows-Portable.exe"
          pick release/windows '*.zip' "Fallout-London-Companion-$VERSION-Windows-Portable.zip"
          pick release/linux '*.AppImage' "Fallout-London-Companion-$VERSION-Linux-x86_64.AppImage"
          pick release/linux '*.deb' "Fallout-London-Companion-$VERSION-Linux-amd64.deb"
          pick release/linux '*.rpm' "Fallout-London-Companion-$VERSION-Linux-x86_64.rpm"
          pick release/linux '*.flatpak' "Fallout-London-Companion-$VERSION-Linux.flatpak"
          (cd release && sha256sum Fallout-London-Companion-"$VERSION"-* > "SHA256SUMS-$VERSION.txt")
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 10

      - name: Generate versioned release notes and build manifest
        if: steps.builds.outputs.release_ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
          IOS_RUN: ${{ steps.builds.outputs.ios_run }}
          ANDROID_RUN: ${{ steps.builds.outputs.android_run }}
          WINDOWS_RUN: ${{ steps.builds.outputs.windows_run }}
          LINUX_RUN: ${{ steps.builds.outputs.linux_run }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os
          from pathlib import Path

          version = os.environ["VERSION"]
          sha = os.environ["SHA"]
          repo = os.environ["REPO"]
          release_dir = Path("release")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = changelog.splitlines()
          sections = []
          current_title = None
          current_lines = []
          for line in lines:
              if line.startswith("## "):
                  if current_title is not None:
                      sections.append((current_title, current_lines))
                  current_title, current_lines = line[3:].strip(), []
              elif current_title is not None:
                  current_lines.append(line)
          if current_title is not None:
              sections.append((current_title, current_lines))

          matching = [(title, body) for title, body in sections
                      if title.lower().startswith(version.lower())]
          if not matching:
              matching = [(title, body) for title, body in sections
                          if title.lower().startswith("unreleased")]
          if not matching:
              raise SystemExit("CHANGELOG.md has no section for this version or Unreleased changes.")
          change_title, change_lines = matching[0]
          change_body = "\n".join(change_lines).strip()
          if not change_body:
              raise SystemExit("The selected CHANGELOG.md section is empty; refusing a changelog-free release.")

          packages = sorted(p for p in release_dir.iterdir()
                            if p.is_file() and p.name.startswith(f"Fallout-London-Companion-{version}-"))
          if len(packages) != 9:
              raise SystemExit(f"Expected 9 installable packages, found {len(packages)}.")
          checksum_file = release_dir / f"SHA256SUMS-{version}.txt"
          if not checksum_file.is_file():
              raise SystemExit("SHA256SUMS file is missing.")

          labels = {
              ".ipa": ("iOS / iPadOS", "Unsigned IPA; requires signing/sideloading."),
              ".apk": ("Android", "Debug APK for sideloading/testing."),
              ".msi": ("Windows", "Windows installer."),
              ".exe": ("Windows", "Portable self-extracting package."),
              ".zip": ("Windows", "Portable application archive."),
              ".AppImage": ("Linux", "x86_64 AppImage."),
              ".deb": ("Linux", "Debian/Ubuntu package."),
              ".rpm": ("Linux", "RPM package."),
              ".flatpak": ("Linux", "Flatpak bundle.")
          }
          table = ["| Platform | Download | Package notes |", "|---|---|---|"]
          manifest_packages = []
          for path in packages:
              platform, note = labels.get(path.suffix, ("Package", "Installable build."))
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              table.append(f"| {platform} | [{path.name}](https://github.com/{repo}/releases/download/{version}/{path.name}) | {note} |")
              manifest_packages.append({"file": path.name, "size_bytes": path.stat().st_size,
                                        "sha256": digest})

          table_text = "\n".join(table)
          notes = f"""# Fallout London Companion {version}

          Coordinated four-platform release for Fallout 4 (Commonwealth) and Fallout: London.
          All installable files below were produced from the same source commit.

          ## What's changed

          Source changelog section: **{change_title}**

          {change_body}

          ## Downloads

          {table_text}

          [SHA-256 checksums](https://github.com/{repo}/releases/download/{version}/{checksum_file.name}) are provided for all nine packages.

          ## Installation notes

          - **iOS:** the IPA is unsigned. Sign it with a compatible sideloading workflow before installation.
          - **Android:** the APK is a debug build intended for direct installation/testing, not a Play Store-signed release.
          - **Windows:** choose the installer for a normal installation or the portable executable for a self-contained launch.
          - **Linux:** choose AppImage, DEB, RPM, or Flatpak according to your distribution and preference.

          ## Verification and known limitations

          All four platform build workflows must succeed for this release to be created. CI success confirms the configured build and test steps; it does not by itself prove live-game protocol behavior or visual correctness. Consult the README and documentation for current game-version, command, and map-data verification boundaries.

          Keep companion traffic on a trusted private network. The game companion protocol has no authentication or encryption; do not expose its ports to the public internet.

          ## Build provenance

          - Repository: {repo}
          - Source commit: [{sha[:12]}](https://github.com/{repo}/commit/{sha})
          - iOS workflow run: {os.environ["IOS_RUN"]}
          - Android workflow run: {os.environ["ANDROID_RUN"]}
          - Windows workflow run: {os.environ["WINDOWS_RUN"]}
          - Linux workflow run: {os.environ["LINUX_RUN"]}

          Independent fan project; not affiliated with or endorsed by Bethesda or Team FOLON.
          """
          (release_dir / f"CHANGELOG-{version}.md").write_text(notes, encoding="utf-8")
          manifest = {
              "product": "Fallout London Companion",
              "version": version,
              "source_commit": sha,
              "repository": repo,
              "workflow_runs": {
                  "ios": int(os.environ["IOS_RUN"]),
                  "android": int(os.environ["ANDROID_RUN"]),
                  "windows": int(os.environ["WINDOWS_RUN"]),
                  "linux": int(os.environ["LINUX_RUN"])
              },
              "packages": manifest_packages,
              "checksums_file": checksum_file.name
          }
          (release_dir / f"BUILD-MANIFEST-{version}.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Generated detailed notes and provenance for {len(packages)} packages.")
          PY

      - name: Create coordinated release
        if: steps.builds.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$VERSION" release/Fallout-London-Companion-"$VERSION"-* release/SHA256SUMS-"$VERSION".txt release/CHANGELOG-"$VERSION".md release/BUILD-MANIFEST-"$VERSION".json \
            --repo "$REPO" \
            --title "Fallout London Companion $VERSION" \
            --notes-file release/CHANGELOG-"$VERSION".md \
            --target "$SHA"
