name: Release Fallout London Companion

on:
  workflow_run:
    workflows:
      - Build Fallout London Companion IPA
      - Build Fallout London Companion Android
      - Build Fallout London Companion Windows
      - Build Fallout London Companion Linux
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: combined-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check all platform builds
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/contents/.release-reset-pending?ref=main" >/dev/null 2>&1; then
            echo "Release history reset is pending; skipping this build."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ios_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion IPA" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          android_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Android" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          windows_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Windows" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          linux_run="$(gh run list --repo "$REPO" --workflow "Build Fallout London Companion Linux" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          for value in "$ios_run" "$android_run" "$windows_run" "$linux_run"; do
            if [[ -z "$value" || "$value" == "null" ]]; then
              echo "release_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ios_run=$ios_run" >> "$GITHUB_OUTPUT"
          echo "android_run=$android_run" >> "$GITHUB_OUTPUT"
          echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
          echo "linux_run=$linux_run" >> "$GITHUB_OUTPUT"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Read and validate release version
        if: steps.builds.outputs.release_ready == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(gh api "repos/$REPO/contents/VERSION?ref=$SHA" --jq '.content' | base64 -d | tr -d '\r\n')"
          [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download platform artifacts
        if: steps.builds.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IOS_RUN: ${{ steps.builds.outputs.ios_run }}
          ANDROID_RUN: ${{ steps.builds.outputs.android_run }}
          WINDOWS_RUN: ${{ steps.builds.outputs.windows_run }}
          LINUX_RUN: ${{ steps.builds.outputs.linux_run }}
        run: |
          set -euo pipefail
          mkdir -p release/ios release/android release/windows release/linux
          gh run download "$IOS_RUN" --repo "$REPO" --name Fallout-London-Companion-ipa --dir release/ios
          gh run download "$ANDROID_RUN" --repo "$REPO" --name Fallout-London-Companion-android-apk --dir release/android
          gh run download "$WINDOWS_RUN" --repo "$REPO" --name Fallout-London-Companion-windows --dir release/windows
          gh run download "$LINUX_RUN" --repo "$REPO" --name Fallout-London-Companion-linux --dir release/linux

      - name: Normalize release filenames and verify package set
        if: steps.builds.outputs.release_ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pick() {
            local dir="$1" pattern="$2" destination="$3"
            local matches=()
            mapfile -t matches < <(find "$dir" -maxdepth 2 -type f -iname "$pattern" | sort)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one $pattern in $dir; found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "release/$destination"
            test -s "release/$destination"
          }
          pick release/ios '*.ipa' "Fallout-London-Companion-$VERSION-iOS-unsigned.ipa"
          pick release/android '*.apk' "Fallout-London-Companion-$VERSION-Android.apk"
          pick release/windows '*.msi' "Fallout-London-Companion-$VERSION-Windows-Installer.msi"
          pick release/windows '*.exe' "Fallout-London-Companion-$VERSION-Windows-Portable.exe"
          pick release/linux '*.AppImage' "Fallout-London-Companion-$VERSION-Linux-x86_64.AppImage"
          pick release/linux '*.deb' "Fallout-London-Companion-$VERSION-Linux-amd64.deb"
          pick release/linux '*.rpm' "Fallout-London-Companion-$VERSION-Linux-x86_64.rpm"
          pick release/linux '*.flatpak' "Fallout-London-Companion-$VERSION-Linux.flatpak"
          (cd release && sha256sum Fallout-London-Companion-"$VERSION"-* > "SHA256SUMS-$VERSION.txt")
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 9

      - name: Write human-authored release notes
        if: steps.builds.outputs.release_ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cat > release-notes.md <<EOF
          # Fallout London Companion $VERSION

          A coordinated multi-platform build of Fallout London Companion, the independent ATTA-Boy-style companion for Fallout 4 / Fallout: London.

          ## Downloads

          All packages below are built from the same source revision and carry the same release version.

          | Platform | Package | Notes |
          |---|---|---|
          | iOS / iPadOS | `Fallout-London-Companion-$VERSION-iOS-unsigned.ipa` | Unsigned IPA; requires a compatible sideloading/signing workflow. |
          | Android | `Fallout-London-Companion-$VERSION-Android.apk` | Debug APK; intended for testing and sideloading. |
          | Windows | `Fallout-London-Companion-$VERSION-Windows-Installer.msi` | Windows installer. |
          | Windows | `Fallout-London-Companion-$VERSION-Windows-Portable.exe` | Portable self-extracting package. |
          | Linux | `Fallout-London-Companion-$VERSION-Linux-x86_64.AppImage` | x86_64 AppImage. |
          | Linux | `Fallout-London-Companion-$VERSION-Linux-amd64.deb` | Debian/Ubuntu package. |
          | Linux | `Fallout-London-Companion-$VERSION-Linux-x86_64.rpm` | RPM package. |
          | Linux | `Fallout-London-Companion-$VERSION-Linux.flatpak` | Flatpak bundle. |

          `SHA256SUMS-$VERSION.txt` contains SHA-256 checksums for all eight installable packages.

          ## Version 1.01 changes

          - **iOS:** retain the canonical 1024×1024 app artwork in the asset catalog; marketing version and build number are updated to 1.01 / 101.
          - **Android:** use the repository's canonical `Assets/AppIcon-Original.png` through the Gradle icon-copy task; remove the obsolete CI download from the retired companion repository; Android version code advances to 146.
          - **Windows and Linux:** native package metadata now follows the shared `VERSION` file (1.01) rather than a stale hard-coded desktop package version. Both builds continue using the canonical repository artwork.
          - No gameplay or companion-protocol behavior changes are included in this packaging release.

          ## Included capabilities

          - STAT, inventory, DATA, MAP and RADIO companion interface foundations.
          - LAN discovery and connection to the PC Pip-Boy companion service.
          - Shared protocol framing and binary database decoding safeguards.
          - Native platform packaging for iOS, Android, Windows and Linux.

          ## Important limitations

          - iOS package is unsigned and must be signed or installed through a compatible sideloading service.
          - Android package is a debug build.
          - Runtime behavior must be validated against a live Fallout: London session; passing CI builds does not establish complete gameplay compatibility or feature parity.
          - A curated Fallout: London world-map basemap and some game-specific data/command behavior remain unverified. See the repository documentation for the current verification boundary.

          ## Installation and support

          Read the repository README for platform-specific installation guidance, LAN setup, troubleshooting and known limitations. Keep companion traffic on a trusted private network; do not expose the game's companion ports to the public internet.

          ## Build provenance

          Source revision: `$SHA`

          This release is generated from one successful build per platform group. No autogenerated contributor list is included.

          Fallout London Companion is an independent fan project and is not affiliated with or endorsed by Bethesda or Team FOLON. Fallout: London and related marks belong to their respective owners.
          EOF

      - name: Create coordinated release
        if: steps.builds.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to replace it."
            exit 0
          fi
          gh release create "$VERSION" release/Fallout-London-Companion-"$VERSION"-* release/SHA256SUMS-"$VERSION".txt \
            --repo "$REPO" \
            --title "Fallout London Companion $VERSION" \
            --notes-file release-notes.md \
            --target "$SHA"
