name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone / iPad
        - Android
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The release number, for example 1.00
      placeholder: "1.00"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and version
      description: Fallout 4 or Fallout London, game version, and companion-service mods if any
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Network setup
      description: Same Wi-Fi/subnet? Did Auto Discover work, or did you use a manual IP? Any firewall changes?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included private Team FOLON material, Bethesda assets, personal data, or private correspondence.
          required: true
